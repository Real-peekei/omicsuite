# Deliberately does NOT install brms: it's a Suggests-only dependency, every
# example and vignette chunk that touches it is gated behind
# requireNamespace()/eval = FALSE, and installing it would pull in the Stan
# toolchain onto the runner just to sit unused during a site build. RGCCA
# stays -- it's a hard Imports and has no compiled-toolchain requirement, so
# it installs like any ordinary CRAN package.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

name: pkgdown

permissions:
  contents: write
  pages: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          single-commit: true
